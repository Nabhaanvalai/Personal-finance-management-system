<html>
  <head>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script>
      // Your web app's Firebase configuration
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
      };

      // Initialize Firebase
      const app = firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();

      // Sign Up function
      function signUp() {
        const fullName = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
          alert('Passwords do not match!');
          return;
        }

        auth.createUserWithEmailAndPassword(email, password)
          .then((userCredential) => {
            // Signed up
            const user = userCredential.user;
            alert('Sign Up successful!');
            // Redirect or perform other actions
          })
          .catch((error) => {
            const errorCode = error.code;
            const errorMessage = error.message;
            alert(`Error: ${errorMessage}`);
          });
      }
    </script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
      <h2 class="text-2xl font-bold mb-2">Sign Up</h2>
      <p class="text-gray-600 mb-6">Create a new account.</p>
      <form onsubmit="event.preventDefault(); signUp();">
        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="fullName">Full Name</label>
          <input
            class="w-full px-3 py-2 border border-gray-300 rounded-lg"
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
          />
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="email">Email</label>
          <input
            class="w-full px-3 py-2 border border-gray-300 rounded-lg"
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 mb-2" for="password">Password</label>
          <input
            class="w-full px-3 py-2 border border-gray-300 rounded-lg"
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          />
        </div>
        <div class="mb-6">
          <label class="block text-gray-700 mb-2" for="confirmPassword">Confirm Password</label>
          <input
            class="w-full px-3 py-2 border border-gray-300 rounded-lg"
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            required
          />
        </div>
        <button
          class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800"
          type="submit"
        >
          Sign Up
        </button>
      </form>
      <p class="mt-6 text-center text-gray-600">
        Already have an account?
        <a class="text-blue-500 hover:underline" href="./auth.html">Login</a>
      </p>
    </div>
  </body>
</html>
